*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body.noscroll{overflow:hidden}
p,span,div,button{text-wrap:pretty}
p{margin:0}
h1,h2{margin:0;font-size:inherit;font-weight:700}
button{font:inherit;color:inherit;text-align:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--ink)}
#root{max-width:430px;margin:0 auto;padding:0 0 28px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 var(--gut)}
.top .back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding-right:12px;font-size:16px;font-weight:700}
.top .back svg{width:20px;height:20px;margin-left:-5px}
.top .n{font-family:var(--mono);font-size:15px}

/* the syringe label */
.lab{margin:0 var(--gut);border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:var(--sec)}
.lab .cls{background:var(--ink);color:#fff;font-weight:700;font-size:15px;line-height:1.3;padding:4px 11px}
.lab .nm{position:relative;padding:6px 38px 4px 11px}
.lab .nm:after{content:"";position:absolute;top:0;bottom:-2px;right:22px;border-left:2px dashed rgba(17,17,17,.55)}
.lab .nmt{display:block;font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:52px;line-height:0.95;letter-spacing:.01em;text-wrap:balance}
.lab .ds{background:#fff;border-top:2px solid var(--ink);border-right:2px solid var(--ink);margin-right:24px;font-size:16px;line-height:1.3;padding:6px 11px 7px}
.lab .warn{position:relative;background:var(--ink);color:#fff;font-size:15.5px;line-height:1.32;font-weight:700;padding:7px 11px 8px 23px;border-top:2px solid var(--ink)}
.lab .warn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(135deg,var(--sec) 0 6px,var(--ink) 6px 12px)}
.lab .warn b{color:var(--sec)}
.lab.plain{background:#fff}
.lab.plain .nm:after{display:none}
.lab.plain .ds{margin-right:0;border-right:0}

/* the picture */
.pic{margin:8px var(--gut);border:2px solid var(--ink);border-radius:7px;padding:7px 10px 8px;background:#fff}
.pic .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;min-height:28px}
.kind{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;line-height:1.25}
.act{border:2px dashed var(--ink);border-radius:999px;font-size:14.5px;font-weight:700;padding:0 13px;min-height:34px;display:inline-flex;align-items:center;white-space:nowrap}
.pic canvas{display:block;width:100%}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.ctl .cn{flex:1 0 100%;font-size:15px;font-weight:700;line-height:1.2;margin:0 0 1px}
.chip{min-height:38px;padding:0 12px;border:2px solid var(--ink);border-radius:999px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;line-height:1;white-space:nowrap;background:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.slider{flex:1 1 160px;display:flex;align-items:center;min-height:40px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--sec);border:2px solid var(--ink);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ink);margin-top:-13px;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
input[type=range]::-moz-range-track{height:6px;background:var(--sec);border:2px solid var(--ink);border-radius:4px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:3px solid #fff}
input[type=text]{width:100%;min-height:42px;font:inherit;font-size:16px;padding:8px 11px;border:2px solid var(--ink);border-radius:7px;background:#fff;color:var(--ink);margin:8px 0 0}
input[type=text]::placeholder{color:#555;opacity:1}
.ro{font-size:14.5px;line-height:1.35;margin-top:7px}

/* the Sycophancy picture: what you would see */
.chat .cq{font-size:15px;font-weight:700;margin:8px 0 6px}
.chat .you{margin-left:56px;background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:6px 10px;font-size:15.5px;line-height:1.3;margin-bottom:7px}
.chat .r{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px}
.chat .tag{font-family:var(--mono);font-size:14px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 0;flex:none;margin-top:3px;width:50px;text-align:center}
.chat .b{background:var(--soft);border-radius:12px 12px 12px 3px;padding:5px 10px;font-size:15.5px;line-height:1.3;flex:1}
.chat .r.on .tag{background:var(--ink);color:#fff}
.chat .r.on .b{background:var(--sec);font-weight:700}

/* try it */
.try{margin:0 var(--gut) 8px;border:2px solid var(--ink);border-radius:7px;padding:7px 10px 9px;background:var(--cream)}
.try .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:5px;min-height:30px}
.copy{background:var(--ink);color:#fff;border-radius:6px;padding:0 13px;font-size:14.5px;font-weight:700;min-height:34px;display:inline-flex;align-items:center;white-space:nowrap}
.pr{font-family:var(--mono);font-size:15px;line-height:1.38}
.fill{background:#FFD100;border-bottom:2px solid var(--ink);padding:0 3px}
.tpre{font-size:15px;line-height:1.35;margin-bottom:4px}
.tpost{font-size:15px;line-height:1.35;margin-top:4px}

.ana{margin:0 var(--gut) 8px;font-size:15.5px;line-height:1.36}
.btns{display:flex;gap:8px;margin:0 var(--gut)}
.btns button{flex:1 1 0;border:2px solid var(--ink);border-radius:7px;padding:0 11px;min-height:42px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:#fff}

/* previous and next, always on screen */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;padding:7px var(--gut) calc(9px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(17,17,17,.10)}
.navin{max-width:402px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1 1 0;min-width:0;background:var(--ink);color:#fff;border-radius:7px;min-height:46px;font-size:16px;font-weight:700;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px}
.spacer{height:calc(76px + env(safe-area-inset-bottom))}

/* sheets: How it works, Sources */
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:430px;max-height:90vh;max-height:90dvh;border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .sh{flex:none;background:var(--sec);border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 8px 7px 14px}
.sheet .sh .t{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase}
.sheet .done{flex:none;background:var(--ink);color:#fff;border-radius:7px;min-height:42px;padding:0 16px;font-weight:700;font-size:16px}
.sheet .sb{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px var(--gut) calc(22px + env(safe-area-inset-bottom))}
.sb .term{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;margin:2px 0 8px}
.sb .def{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 12px}
.sb p{font-size:16.5px;line-height:1.5;margin:0 0 12px}
.sb .rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px}
.sb .rh{width:100%;font-weight:700;font-size:16px}
.rchip{min-height:40px;padding:0 13px;border:2px solid var(--ink);border-radius:7px;background:var(--sec);font-weight:700;font-size:15px;display:inline-flex;align-items:center}
.src .finding{font-size:16px;line-height:1.45;margin:0 0 4px}
.src .cite{font-size:14px;line-height:1.45;margin:0 0 16px}
.src a{font-family:var(--mono);font-size:13.5px;word-break:break-word}
.src .held{color:#3A3F42}
.alls{border:2px solid var(--ink);border-radius:7px;min-height:42px;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;background:#fff}

/* home: the induction tray */
.kickrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 16px 0;min-height:36px}
.kick{font-size:16px;font-weight:700}
.tl{display:flex;gap:6px}
.tl button{border:2px solid var(--ink);border-radius:999px;font-size:14.5px;font-weight:700;padding:0 12px;min-height:34px;display:inline-flex;align-items:center}
.mtitle{font-family:var(--disp);font-weight:700;font-size:50px;line-height:0.92;text-transform:uppercase;margin:4px 16px 0}
.lede{font-size:16.5px;line-height:1.36;margin:9px 16px 11px}
.play{display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:0 16px 14px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;text-align:left}
.pbtn{width:42px;height:42px;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.pbtn svg{width:15px;height:17px;margin-left:3px}
.ptx b{display:block;font-size:18px;line-height:1.2}
.ptx span{display:block;font-size:15px;line-height:1.3}
.play.small{width:100%;margin:8px 0 0;padding:7px 10px;gap:10px}
.play.small .pbtn{width:34px;height:34px}
.play.small .ptx b{font-size:16px}
.play.small .ptx span{font-size:14px}
.th{margin:0 16px 7px;font-size:16px;font-weight:700}
.tray{margin:0 12px;border-radius:20px;padding:11px 4px;background:linear-gradient(180deg,#E8ECEE,#CDD4D8);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 6px #B9C1C6,0 1px 0 #9AA3A8;border:1.5px solid #9AA3A8}
.slot{display:block;width:100%;padding:4px 0;border-radius:10px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.slot svg{display:block;width:100%;max-width:358px;height:auto;margin:0 auto}
.slot:nth-child(odd) svg{transform:rotate(-0.6deg)}
.slot:nth-child(even) svg{transform:rotate(0.5deg)}
.slot:active svg{transform:translateY(-3px) rotate(0deg)}
.hint{margin:9px 16px 0;font-size:15px;line-height:1.3}
.cred{margin:11px 16px 0;font-size:13.5px;line-height:1.3}

/* section page and index */
.tiles{margin:10px var(--gut) 0;display:grid;grid-template-columns:1fr;gap:8px}
.tile{display:grid;grid-template-columns:52px 1fr 22px;align-items:center;width:100%;min-height:64px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:linear-gradient(90deg,var(--sec) 0 52px,#fff 52px)}
.tile .tn{justify-self:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-family:var(--disp);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;line-height:1}
.tile .tt{padding:8px 4px 9px 12px;border-left:2px solid var(--ink);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.tile .tnm{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.tile .ts{font-size:15px;line-height:1.3;margin-top:3px}
.tile .tgo{font-size:24px;font-weight:700;line-height:1}
.page{padding-bottom:4px}
.about,.allsrc{margin:14px var(--gut) 0}
.about p{font-size:16.5px;line-height:1.5;margin:0 0 12px}
.about .h{font-weight:700;font-size:19px;margin:18px 0 6px}
.allsrc p{font-size:14.5px;line-height:1.45;margin:0 0 12px}
.allsrc a{font-family:var(--mono);font-size:13.5px;word-break:break-word}
footer{margin:26px var(--gut) 0;padding-top:12px;border-top:2px solid var(--ink);font-size:13.5px;line-height:1.4}
footer .fl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
footer button{font-weight:700;font-size:14.5px;min-height:44px;text-decoration:underline;text-underline-offset:3px}

/* the film page */
.film-wide{margin:8px var(--gut) 0}
.instrument.film{border:2px solid var(--ink);border-radius:7px;padding:10px 12px;background:#fff}
.instrument.film canvas{display:block}
.film-wide .controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0}
.fph{margin:0 0 6px}
.film-wide .readout{font-size:14.5px;line-height:1.4;margin:8px 0 0;min-height:42px}
.chip.action{border-style:dashed}
.chip:disabled{cursor:default}
.body{margin:14px var(--gut) 0}
.body p{font-size:16.5px;line-height:1.5;margin:0 0 12px}
.wside{margin:0 var(--gut)}
.wside .rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.wside .rh{width:100%;font-weight:700;font-size:16px}
/* a tap shows: pressed controls darken and settle */
.chip:active,.act:active,.copy:active,.btns button:active,.nav button:active,.tile:active,.ltile:active,.rchip:active,.alls:active,.play:active,.tl button:active,.top .back:active,.done:active{filter:brightness(.9);transform:translateY(1px)}
/* on a touch screen the Previous/Next bar steps aside while the keyboard is up */
@media (hover:none) and (pointer:coarse){ body.typing .nav{display:none} }
.errpill{position:fixed;left:12px;right:12px;bottom:12px;background:#822A24;color:#fff;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:8px;display:none;z-index:99}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

/* iPad and wider windows: the same column, larger */
@media (min-width:700px) and (min-height:600px){
  :root{--gut:0px;--nmmax:68}
  #root{max-width:720px;padding:0 32px 36px}
  .top{padding:0}
  .lab .cls{font-size:17px;padding:5px 14px}
  .lab .nm{padding:8px 44px 6px 14px}
  .lab .nm:after{right:26px}
  .lab .ds{font-size:18px;padding:8px 14px 9px;margin-right:28px}
  .lab .warn{font-size:17.5px;padding:9px 14px 10px 28px}
  .lab .warn:before{width:15px;background:repeating-linear-gradient(135deg,var(--sec) 0 7px,var(--ink) 7px 14px)}
  .pic{margin:12px 0;padding:10px 14px 12px}
  .ro{font-size:16px}
  .chip{font-size:16px;min-height:42px;padding:0 15px}
  .ctl .cn{font-size:16.5px}
  .try{margin:0 0 12px;padding:10px 14px 12px}
  .try .h{font-size:16.5px}
  .pr{font-size:16.5px}
  .tpre,.tpost{font-size:16.5px}
  .ana{margin:0 0 12px;font-size:17.5px}
  .btns button{font-size:17px;min-height:48px}
  .navin{max-width:720px}
  .nav{padding-left:32px;padding-right:32px}
  .nav button{font-size:17px;min-height:50px}
  .spacer{height:calc(86px + env(safe-area-inset-bottom))}
  .chat .you,.chat .b{font-size:17px}
  .chat .cq{font-size:16.5px}
  .sheet{max-width:720px;border-radius:14px;border-bottom:2px solid var(--ink);margin-bottom:auto;margin-top:auto;max-height:86vh}
  .sheetbg{align-items:center;padding:24px}
  .sheet .sb{padding:16px 22px 26px}
  .sb p{font-size:17.5px}
  .sb .def{font-size:20px}
  .kickrow,.mtitle,.lede,.th,.hint,.cred{margin-left:0;margin-right:0}
  .play{width:100%;margin-left:0;margin-right:0}
  .mtitle{font-size:84px}
  .lede{font-size:19px;max-width:560px}
  .tray{margin:0;padding:18px 24px;border-radius:26px}
  .slot svg{max-width:560px}
  .tiles{margin:14px 0 0;grid-template-columns:1fr 1fr;gap:10px}
  .tile .tnm{font-size:28px}
  .about,.allsrc,.body,.wside,.film-wide{margin-left:0;margin-right:0}
  .cpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:start}
  .cpair .try{margin-bottom:0}
  .cpair .btns{flex-wrap:wrap}
  footer{margin-left:0;margin-right:0}
}
/* Mac and iPad on its side: picture beside the label */
@media (min-width:1000px) and (min-height:600px){
  :root{--nmmax:76}
  #root{max-width:1240px;padding:0 40px 36px}
  .cgrid{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,11fr);column-gap:36px;align-items:start;margin-top:2px}
  .cgrid .pic{margin-top:0}
  .cl .lab{margin-bottom:12px}
  .navin{max-width:1160px}
  .nav{padding-left:40px;padding-right:40px}
  .home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;align-items:center;min-height:calc(100vh - 80px)}
  .mtitle{font-size:104px}
  .lede{font-size:20px}
  .hr .tray{padding:22px 26px}
  .cred{margin-top:18px}
  /* section page: the section label across the top, its cards as a row of small labels, the block centred between the bars */
  .secg{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 166px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:4px 0 8px}
  .secg.many{--nmmax:68}
  .ltiles{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:16px;margin-top:18px;align-items:stretch}
  .ltile{display:flex;flex-direction:column;width:100%;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff;transition:transform .12s ease-out}
  .ltile:hover{transform:translateY(-3px)}
  .ltile .lcls{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;font-weight:700;font-size:15px;line-height:1.3;padding:4px 11px}
  .ltile .lnm{display:block;background:var(--sec);font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:36px;line-height:0.95;padding:9px 11px 7px;text-wrap:balance}
  .ltile .lds{display:block;flex:1 0 auto;border-top:2px solid var(--ink);font-size:16.5px;line-height:1.32;padding:8px 11px 10px}
  .ltile .lwarn{display:block;position:relative;background:var(--ink);color:#fff;font-weight:700;font-size:15px;line-height:1.34;padding:8px 11px 10px 23px}
  .ltile .lwarn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(135deg,var(--sec) 0 6px,var(--ink) 6px 12px)}
  .ltile .lwarn b{color:var(--sec)}
  /* the fewer the cards, the larger the labels */
  .ltiles.c3 .lcls{font-size:17px;padding:5px 13px}
  .ltiles.c3 .lnm{font-size:52px;padding:10px 13px 8px}
  .ltiles.c3 .lds{font-size:20px;padding:10px 13px 12px}
  .ltiles.c3 .lwarn{font-size:18.5px;padding:10px 13px 12px 27px}
  .ltiles.c3 .lwarn:before{width:14px}
  .ltiles.c4 .lcls{font-size:16px}
  .ltiles.c4 .lnm{font-size:42px}
  .ltiles.c4 .lds{font-size:18px;padding:9px 11px 11px}
  .ltiles.c4 .lwarn{font-size:16.5px;padding:9px 11px 11px 24px}
  .ltiles.cmany .lnm{font-size:34px;padding:8px 10px 6px}
  .ltiles.cmany .lds{font-size:15.5px;padding:7px 10px 8px}
  .ltiles.cmany .lwarn{font-size:14px;padding:7px 10px 8px 22px}
  /* index: four columns, every term on one screen */
  .tiles.az{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
  .tiles.az .tile{grid-template-columns:46px 1fr 18px;background:linear-gradient(90deg,var(--sec) 0 46px,#fff 46px)}
  .tiles.az .tile .tn{width:32px;height:32px;font-size:18px}
  .tiles.az .tile .tt{padding:7px 2px 8px 10px}
  .tiles.az .tile .tnm{font-size:25px}
  .tiles.az .tile .ts{font-size:14.5px}
  .about{column-count:2;column-gap:56px}
  .about .h{break-after:avoid}
  .about p{break-inside:avoid}
  .allsrc{column-count:2;column-gap:56px}
  .allsrc p{break-inside:avoid}
  .wcols{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);column-gap:56px;align-items:start}
  .sheet{max-width:780px}
  .chat .you,.chat .b{font-size:18px}
  .chat .tag{width:58px;font-size:15px}

eads the monitor and the model reads the window. The number on the monitor is a summary and the score from the model is a prediction. The patient is watched and the output is checked.\nPropofol is given at induction and sevoflurane is given through the circuit. Propofol is stopped at the end and sevoflurane is stopped at the end. Remifentanil is given by infusion and propofol is given by infusion. Sevoflurane is read from the gas analyser and propofol is drawn up from the ampoule. The dose of propofol is written in milligrams per kilogram and the dose of remifentanil is written in micrograms per kilogram. Ondansetron is given for nausea and paracetamol is given for pain. Ketamine is given at induction in a sick patient and propofol is avoided when the blood pressure is low. The pressure falls after propofol and the pressure falls after sevoflurane. The monitor shows the pressure and the monitor shows the saturation. The ventilator shows the tidal volume and the ventilator shows the airway pressure.";</script>

<script>// ENGINE: a small, real language-model kit that runs in the page.

  // Sycophancy: the replies you would see, and how often the learner gives each one after 80 trials.

    [["holtzman20","sampling"],["patel24","phases"]].forEach(function(pair){ var s=SOURCES[pair[0]], c=cardById(pair[1]); var f = c ? (c.from||[]).filter(function(x){return x.s===pair[0];})[0] : null;
      if(f) src.appendChild(el("p",{class:"finding",text:f.t}));
      var p=el("p",{class:"cite"},[s.cite+" "]); p.appendChild(el("a",{href:s.link,target:"_blank",rel:"noopener noreferrer",text:s.label})); p.appendChild(el("span",{class:"held",text:" · "+s.held})); src.appendChild(p); });
    // below the film: one column on a phone; on a wide window the text on the left, related terms and sources on the right
    root.appendChild(el("div",{class:"wcols"},[el("div",{class:"wtext"},[body]), el("div",{class:"wside"},[rel, src])]));
    root.appendChild(footer());
    fitNames(root);

    var reduced = false; try { reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
    var F = {canvas:canvas, ctx:canvas.getContext("2d"), dpr:Math.min(2, window.devicePixelRatio||1), t:0, playing:!reduced, target:null, reduced:reduced, lastNarr:"", lastBtn:"", dirty:true};
    function setRun(i){ FILM.idx = i; F.run = filmRun(filmSeed(i)); F.T = filmTimeline(F.run, reduced); F.endT = F.T[F.T.length-1].t0; F.t = 0; F.target = null; layout(); }
    function layout(){
      var cssW = win.clientWidth - 24 - 2; if(cssW < 200) cssW = 200;
      F.dpr = Math.min(2, window.devicePixelRatio||1);
      F.L = filmLayout(F.ctx, cssW, F.run);
      canvas.width = Math.round(cssW*F.dpr); canvas.height = Math.round(F.L.H*F.dpr);
      canvas.style.width = cssW+"px"; canvas.style.height = F.L.H+"px";
      F.dirty = true;
    }
    function ui(){
      var atEnd = F.t >= F.endT;
      var lbl = F.playing ? "Pause" : (atEnd && F.t >= F.endT + F.T[F.T.length-1].dT ? "Play again" : "Play");
      if(lbl !== F.lastBtn){ bPlay.textContent = lbl; F.lastBtn = lbl; }
      var dis = atEnd; bStep.disabled = dis; bStep.style.opacity = dis ? "0.4" : "";
    }
    bPlay.addEventListener("click", function(){
      if(F.playing){ F.playing = false; F.target = null; }
      else { if(F.t >= F.endT + F.T[F.T.length-1].dT){ F.t = 0; } F.target = null; F.playing = true; }
      F.dirty = true; ui();
    });
    bStep.addEventListener("click", function(){
      var cur = filmAt(F, F.t), nx = filmStartOf(F, cur.i+1, "score");
      var tgt = nx ? nx.t0 + nx.dT : F.endT + F.T[F.T.length-1].dT;
      if(reduced){ F.t = tgt; F.playing = false; F.target = null; }
      else { F.target = tgt; F.playing = true; }
      F.dirty = true; ui();
    });
    bAgain.addEventListener("click", function(){ setRun(FILM.idx+1); F.playing = true; F.dirty = true; ui(); });
    setRun(0);
    var last = null;
    function frame(now){
      if(!document.body.contains(canvas)){ window.removeEventListener("resize", onResize); return; }
      if(last === null) last = now;
      var dt = Math.min(100, now - last); last = now;
      if(F.playing){
        F.t += dt; F.dirty = true;
        if(F.target !== null && F.t >= F.target){ F.t = F.target; F.target = null; F.playing = false; }
        if(F.t >= F.endT + F.T[F.T.length-1].dT){ F.playing = false; }
      }
      if(F.dirty){
        try { filmDraw(F); } catch(e){ showErr("film: "+(e&&e.message)); F.playing = false; }
        var n = filmNarr(F, F.cur); if(n !== F.lastNarr){ readout.textContent = n; F.lastNarr = n; }
        ui(); F.dirty = false;
      }
      requestAnimationFrame(frame);
    }
    var onResize = function(){ if(document.body.contains(canvas)){ layout(); } };
    window.addEventListener("resize", onResize);
    // test hook: render the film at a given time (ms)
    window.__film = {seek:function(t){ F.t = t; F.playing = false; F.target = null; F.dirty = true; filmDraw(F); var n = filmNarr(F, F.cur); readout.textContent = n; F.lastNarr = n; ui(); return F.cur; }, dur:function(){ return F.endT + F.T[F.T.length-1].dT; }, T:function(){ return F.T.map(function(e){ return {i:e.i, ph:e.ph, t0:e.t0, dT:e.dT, dH:e.dH}; }); }, run:function(){ return F.run; }, L:function(){ return F.L; }, again:function(){ bAgain.click(); }, play:function(){ F.playing = true; ui(); }};
    requestAnimationFrame(frame);
  }

  // ---- errors
  function showErr(m){ var p=document.getElementById("errpill"); if(!p) return; p.textContent="This page hit an error: "+m; p.style.display="block"; }
  window.addEventListener("error", function(e){ if(e && e.message && e.message!=="Script error." && e.filename) showErr(e.message); });

  // ---- boot
  function corpusText(){
    var parts=[CORPUS_BASE];
    CARDS.forEach(function(c){ parts.push(c.what); parts = parts.concat(c.body); parts.push(c.analogy); });
    return parts.join(" ");
  }
  function pickContexts(){
    var m = ENG.state.model, cands=[];
    for(var k in m.triCtx){
      var ab=k.split("\u0001"); if(ab[0]===ENGINE.BOS || ab[1]===ENGINE.BOS) continue;
      if(!/^\u2581[a-z]{2,}$/.test(ab[0]) || !/^\u2581[a-z]{2,}$/.test(ab[1])) continue;
      var d=m.tri[k], types=Object.keys(d); if(types.length<4) continue;
      var whole = types.filter(function(t){return /^\u2581[a-z]{3,}$/.test(t);}).length/types.length;
      if(whole<0.75) continue;
      cands.push({p2:ab[0],p1:ab[1],l:(ENGINE.display(ab[0])+ENGINE.display(ab[1])).trim(),types:types.length,n:m.triCtx[k]});
    }
    cands.sort(function(a,b){ return b.types-a.types || b.n-a.n; });
    RICH = cands.slice(0,3);
    if(!RICH.length) RICH=[{p2:"\u2581of",p1:"\u2581the",l:"of the"}];
  }
  function pickWords(){
    var have = ENG.state.emb.words, pref = ["\u2581propofol","\u2581patient","\u2581monitor","\u2581dose"];
    WORDS = pref.filter(function(w){ return have.indexOf(w)>=0; }).map(function(w){ return {l:w.slice(1), v:w}; });
    while(WORDS.length<4 && have.length>WORDS.length){ var w2=have[WORDS.length]; if(!WORDS.some(function(x){return x.v===w2;})) WORDS.push({l:w2.slice(1), v:w2}); else break; }
  }
  function pickPrompts(){
    PROMPTS = [{l:"propofol is"},{l:"the tube is"},{l:"the model has"}];
  }
  function boot(){
    var t0=Date.now();
    var r0=document.getElementById("root"); if(r0) r0.innerHTML="";
    ENG = ENGINE; ENGINE.init(corpusText(), {merges:1500});
    pickContexts(); pickPrompts(); pickWords();
    window.__ready = {ms:Date.now()-t0, sents:ENGINE.state.sents.length, merges:ENGINE.state.merges.length, vocab:ENGINE.state.model.vocab.length, rich:RICH.map(function(r){return r.l;}), words:WORDS.map(function(w){return w.l;})};
    try { if("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}
    try { CUR = location.hash || "#/"; } catch(e){ CUR = "#/"; }
    route();
    try { history.replaceState({r:CUR}, "", plainURL()); } catch(e){}
    window.addEventListener("popstate", onPop);
    window.addEventListener("hashchange", onHash);
  }
  (function(){ var r=document.getElementById("root"); if(r) r.innerHTML='<div class="home"><div class="hl"><div class="kickrow"><span class="kick">A dictionary for clinicians</span></div><h1 class="mtitle">How the AI you use works</h1><p class="lede">Training the small model on this page\u2019s text\u2026</p></div></div>'; })();
  if(document.fonts && document.fonts.load){
    Promise.all(['700 16px "Big Shoulders"','16px "Outfit"','700 16px "Outfit"','16px "Red Hat Mono"','700 16px "Red Hat Mono"'].map(function(f){ return document.fonts.load(f); })).then(boot, boot);
  } else boot();
})();
