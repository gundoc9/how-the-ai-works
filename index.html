:root{
  --bg:#EFE9DC; --card:#F7F3EA; --ink:#1B1A17; --dim:#5A5449; --line:#CFC7B6; --accent:#1F3A93;
  --win:#F7F3EA; --winInk:#1B1A17; --winDim:#5A5449; --amber:#E4C800; --grid:#E9E4D8;
  --sans:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16.5px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;text-align:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
#root{max-width:620px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;align-items:center;min-height:56px;padding:6px 0 2px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px 0 0;color:var(--ink);font-size:16px}
.back svg{width:22px;height:22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1.title{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.05;margin:14px 0 10px;letter-spacing:-.005em}
h1.title mark{background:linear-gradient(to top, rgba(255,228,92,0) 8%, rgba(255,228,92,0.85) 8%, rgba(255,228,92,0.85) 78%, rgba(255,228,92,0) 78%);color:inherit;padding:0 .06em}
.instrument.hero{margin:6px 0 4px}
h2.title{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;margin:8px 0 10px}
.lede{font-size:17px;line-height:1.5;color:var(--ink);margin:0 0 18px}
.what{font-size:18.5px;line-height:1.42;margin:0 0 18px}
.section{margin:26px 0 8px}
.section .eyebrow{display:block;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fitrow{display:block;width:100%;padding:12px 0;border-bottom:1px solid var(--line);min-height:44px}
.fitrow .sn{display:block;font-family:var(--serif);font-size:21px;line-height:1.2;margin-bottom:2px}
.fitrow .st{display:block;font-size:15px;line-height:1.45;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 24px;grid-template-rows:auto auto;column-gap:10px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);min-height:44px;align-items:start}
.row .t{font-family:var(--serif);font-size:25px;line-height:1.15;grid-column:1}
.row .w{font-size:14.5px;line-height:1.4;color:var(--dim);grid-column:1;margin-top:3px}
.row .go{grid-column:2;grid-row:1;color:var(--dim);display:flex;justify-content:flex-end;align-items:center;height:29px}
.row .go svg{width:20px;height:20px}
.instrument{background:var(--win);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin:4px 0 12px}
.instrument canvas{display:block;width:100%}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.cname{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);width:100%;margin:2px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{min-height:44px;padding:0 15px;border:1.5px solid var(--ink);border-radius:22px;font-size:15px;line-height:1;display:inline-flex;align-items:center;color:var(--ink);background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.action{border-style:dashed}
.readout{font-family:var(--mono);font-size:13px;line-height:1.45;color:var(--ink);margin:6px 0 14px;min-height:22px}
.label{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:3px 7px;margin:0;white-space:nowrap}
.body p{margin:0 0 14px}
.analogy{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;margin:18px 0 22px;padding-left:14px;border-left:3px solid var(--amber)}
.analogy .k{font-family:var(--mono);font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.related{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.related .chip{min-height:44px;border-color:var(--line)}
.sources{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.sources p{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink);margin:0 0 10px}
.sources p.finding{font-size:15.5px;line-height:1.5;color:var(--ink);margin:0 0 4px}
.sources p.cite{font-size:13px;color:var(--dim);margin:0 0 14px}
.sources a{font-family:var(--mono);font-size:12.5px}
.sources .held{color:var(--dim)}
.slider{width:100%;display:flex;align-items:center;min-height:44px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);margin-top:-13px;border:0}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--ink);border:0}
input[type=text]{width:100%;min-height:44px;font:inherit;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 10px}
input[type=text]::placeholder{color:var(--dim);opacity:1}
.nav{display:flex;justify-content:space-between;gap:12px;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.nav .chip{flex:1 1 0;justify-content:center}
.about p{margin:0 0 14px}
.about .h{font-family:var(--serif);font-size:24px;margin:20px 0 6px}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.5}
footer button{color:var(--accent);font-size:13px;min-height:44px}
.errpill{position:fixed;left:12px;right:12px;bottom:12px;background:#822A24;color:#fff;font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:8px;display:none;z-index:9}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

</style>

<script>var CORPUS_BASE = "An anaesthetist gives a drug and watches what happens. Propofol is given at induction and the patient loses consciousness within a minute. The dose is chosen for the patient, and the response is watched on the monitor. Remifentanil is given by infusion and its effect fades within minutes of stopping. Sevoflurane is given through the breathing circuit and the concentration is read from the gas analyser. The monitor shows the heart rate, the blood pressure and the oxygen saturation. The capnograph shows carbon dioxide in the expired breath, and a flat trace after intubation means the tube is not in the trachea. A low blood pressure after induction is common and is treated with fluid or a vasopressor. The blood pressure is measured every three minutes, or continuously from an arterial line. An arterial line is placed in the radial artery under local anaesthetic. A central line is placed in the internal jugular vein with ultrasound. The ultrasound shows the needle tip inside the vein before the wire is passed. The airway is assessed before induction and a plan is made for a difficult airway. The laryngoscope is used to see the vocal cords and the tube is passed between them. The tube is fixed at the correct depth and the chest is checked for air entry on both sides. The ventilator is set to a tidal volume for the patient and the pressure is watched. The patient is kept warm with a forced air warmer and the temperature is measured. Fluid is given to replace what is lost and blood is given if the haemoglobin falls. The surgeon asks for the table to be tilted and the anaesthetist checks the pressure again. At the end of the operation the drug is stopped and the patient wakes. The patient is taken to the recovery room and watched until awake and comfortable. Pain is treated with paracetamol and an opioid, and nausea is treated with ondansetron. A child is given a smaller dose by weight and a parent is present at induction. A baby is kept warm and the fluid is given by a pump. The dose of a drug is written in milligrams per kilogram, and the volume is drawn up from the ampoule. The drug chart is checked before the drug is given. The pump is set to a rate and the rate is checked. The monitor alarms when the saturation falls and the anaesthetist checks the probe first. The EEG shows the brain under anaesthesia and the spectrogram shows the frequencies over time. A frontal alpha rhythm is seen under propofol and it fades as the patient wakes. Burst suppression is seen when the dose is too high or the blood pressure is too low. The number on the depth monitor is a summary of the EEG and it can be wrong. The raw trace is read before the number is trusted. A model reads text and predicts the next token. The text is cut into tokens and the tokens are scored one at a time. The score is a probability and the probabilities add up to one. A token is drawn from the scores and added to the text, and the model predicts again. The model is trained on a large amount of text and the parameters are adjusted during training. The parameters are numbers and there are billions of them. The model has a window and it sees only the text inside the window. The system prompt is placed at the start of the window and the model reads it every turn. The temperature changes the scores before a token is drawn. A low temperature picks the likely token and a high temperature picks from the tail. A model can be wrong in a fluent sentence, and the reference it gives may not exist. A retrieved passage is placed in the window and the model reads it with the question. The training text stops at a date and the model does not know what happened after the date. A foundation model is trained on broad data and adapted to many tasks. The model is calibrated when the confidence matches the accuracy. The model predicts the next token from the last few tokens in this page. The tokeniser is trained on this page and the vocabulary is small. The anaesthetist reads the monitor and the model reads the window. The number on the monitor is a summary and the score from the model is a prediction. The patient is watched and the output is checked.\nPropofol is given at induction and sevoflurane is given through the circuit. Propofol is stopped at the end and sevoflurane is stopped at the end. Remifentanil is given by infusion and propofol is given by infusion. Sevoflurane is read from the gas analyser and propofol is drawn up from the ampoule. The dose of propofol is written in milligrams per kilogram and the dose of remifentanil is written in micrograms per kilogram. Ondansetron is given for nausea and paracetamol is given for pain. Ketamine is given at induction in a sick patient and propofol is avoided when the blood pressure is low. The pressure falls after propofol and the pressure falls after sevoflurane. The monitor shows the pressure and the monitor shows the saturation. The ventilator shows the tidal volume and the ventilator shows the airway pressure.";</script>

  // ---- errors
  function showErr(m){ var p=document.getElementById("errpill"); if(!p) return; p.textContent="This page hit an error: "+m; p.style.display="block"; }
  window.addEventListener("error", function(e){ if(e && e.message && e.message!=="Script error." && e.filename) showErr(e.message); });

  // ---- boot
  function corpusText(){
    var parts=[CORPUS_BASE];
    CARDS.forEach(function(c){ parts.push(c.what); parts = parts.concat(c.body); parts.push(c.analogy); });
    return parts.join(" ");
  }
  function pickContexts(){
    var m = ENG.state.model, cands=[];
    for(var k in m.triCtx){
      var ab=k.split("\u0001"); if(ab[0]===ENGINE.BOS || ab[1]===ENGINE.BOS) continue;
      if(!/^\u2581[a-z]{2,}$/.test(ab[0]) || !/^\u2581[a-z]{2,}$/.test(ab[1])) continue;
      var d=m.tri[k], types=Object.keys(d); if(types.length<4) continue;
      var whole = types.filter(function(t){return /^\u2581[a-z]{3,}$/.test(t);}).length/types.length;
      if(whole<0.75) continue;
      cands.push({p2:ab[0],p1:ab[1],l:(ENGINE.display(ab[0])+ENGINE.display(ab[1])).trim(),types:types.length,n:m.triCtx[k]});
    }
    cands.sort(function(a,b){ return b.types-a.types || b.n-a.n; });
    RICH = cands.slice(0,3);
    if(!RICH.length) RICH=[{p2:"\u2581of",p1:"\u2581the",l:"of the"}];
  }
  function pickWords(){
    var have = ENG.state.emb.words, pref = ["\u2581propofol","\u2581patient","\u2581monitor","\u2581dose"];
    WORDS = pref.filter(function(w){ return have.indexOf(w)>=0; }).map(function(w){ return {l:w.slice(1), v:w}; });
    while(WORDS.length<4 && have.length>WORDS.length){ var w2=have[WORDS.length]; if(!WORDS.some(function(x){return x.v===w2;})) WORDS.push({l:w2.slice(1), v:w2}); else break; }
  }
  function pickPrompts(){
    PROMPTS = [{l:"propofol is"},{l:"the tube is"},{l:"the model has"}];
  }
  function boot(){
    var t0=Date.now();
    var r0=document.getElementById("root"); if(r0) r0.innerHTML="";
    ENG = ENGINE; ENGINE.init(corpusText(), {merges:1500});
    pickContexts(); pickPrompts(); pickWords();
    window.__ready = {ms:Date.now()-t0, sents:ENGINE.state.sents.length, merges:ENGINE.state.merges.length, vocab:ENGINE.state.model.vocab.length, rich:RICH.map(function(r){return r.l;}), words:WORDS.map(function(w){return w.l;})};
    try { CUR = location.hash || "#/"; } catch(e){ CUR = "#/"; }
    window.addEventListener("hashchange", onHash);
    route();
  }
  (function(){ var r=document.getElementById("root"); if(r) r.innerHTML='<div class="top"><span class="eyebrow">A dictionary for clinicians</span></div><h1 class="title">How the AI you use works</h1><p class="lede">Training the small model on this page\u2019s text\u2026</p>'; })();
  if(document.fonts && document.fonts.load){
    Promise.all(['16px "Instrument Serif"','italic 16px "Instrument Serif"','16px "Instrument Sans"','700 16px "Instrument Sans"','16px "Geist Mono"'].map(function(f){ return document.fonts.load(f); })).then(boot, boot);
  } else boot();
})();
</script>
